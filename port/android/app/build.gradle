plugins {
    id "com.android.application"
}

// The distribution ships a matched native payload and SDL Java sources.
// tools/android_studio_stage.py refreshes these after a native rebuild.
def staged = new File(projectDir, "../native")

// a build of main knows its number (tools/ci_build.py), which names its
// release and which the self-updater (Updater.java) compares; others have
// none and never look for updates
def buildNumberText = System.getenv("HALO_BUILD_NUMBER") ?: "0"
def buildNumber = buildNumberText.isInteger() ? buildNumberText.toInteger() : 0

// the workflow's signing key (.github/workflows/build.yml): every build of
// main signed with it can install over the one before; without it, the
// debug key of the computer that builds
def signingKey = System.getenv("HALO_ANDROID_KEYSTORE")

// Patch47: versioned settings header; the confirmed gyro and renderer fixes are retained.
// Diagnostic UI and startup files are off for every normal build, including
// debug. Keep the capture code available for an explicitly requested build:
// ./gradlew -PhaloDiagnostics=true :app:assembleMobileRelease
def diagnosticsEnabled = providers.gradleProperty("haloDiagnostics")
    .map { it.equalsIgnoreCase("true") }.getOrElse(false)

android {
    namespace "com.halo.decomp"
    compileSdk 35

    defaultConfig {
        applicationId "com.halo.decomp"
        minSdk 28
        targetSdk 35
        versionCode 19
        versionName "1.0.6"
        buildConfigField "int", "HALO_BUILD_NUMBER", "${buildNumber}"
        buildConfigField "boolean", "HALO_DIAGNOSTICS_ENABLED", "${diagnosticsEnabled}"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    flavorDimensions "device"
    productFlavors {
        mobile {
            dimension "device"
            buildConfigField "boolean", "IS_AAOS", "false"
        }
        aaos {
            dimension "device"
            minSdk 29
            buildConfigField "boolean", "IS_AAOS", "true"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(staged, "sdl-java")
            jniLibs.srcDirs = [new File(staged, "jniLibs")]
            assets.srcDirs = [new File(staged, "assets"), file("src/main/assets")]
        }
    }

    // the guest image is read straight from the APK
    androidResources {
        noCompress += ["elf"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (signingKey) {
            halo {
                storeFile file(signingKey)
                storePassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HALO_ANDROID_KEY_ALIAS") ?: "halo"
                keyPassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation files("libs/retrotouch.aar") }

tasks.register("verifyNativePayload") {
    doLast {
        ["assets/halo_guest.elf", "jniLibs/arm64-v8a/libmain.so",
         "jniLibs/arm64-v8a/libSDL3.so", "sdl-java/org/libsdl/app/SDLActivity.java"].each { path ->
            if (!new File(staged, path).isFile()) {
                throw new GradleException("Missing native payload: " + path
                    + ". Run ninja android, then python3 tools/android_studio_stage.py from the repository root.")
            }
        }
    }
}
tasks.named("preBuild").configure { dependsOn("verifyNativePayload") }

